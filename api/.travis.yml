language: php

php:
  - '8.2'
  - '8.3'
  - '8.4'
  - '8.5'

cache:
  directories:
    - $HOME/.composer/cache

before_install:
  - composer self-update --2

install:
  - composer install --prefer-dist --no-interaction

script:
  - composer validate --no-check-publish
  - composer check-platform-reqs
  - find app config route public -name '*.php' -print0 | xargs -0 -n1 php -l
  - php think version
