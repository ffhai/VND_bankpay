<!DOCTYPE html>
<html lang="{$locale}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{:lang('system_notice')}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
<!--    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">-->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .secure-bg {
            background-color: #f8fafc;
            background-image:
                    radial-gradient(#cbd5e1 0.75px, transparent 0.75px),
                    radial-gradient(#cbd5e1 0.75px, #f8fafc 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        .transition-all {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="secure-bg min-h-screen flex items-center justify-center p-4">

<!-- Main Container Card -->
<div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-2xl shadow-xl overflow-hidden border border-slate-100">

    <!-- Header / Banner -->
    <div class="bg-gradient-to-r from-rose-600 to-red-600 px-6 py-4 text-white text-center">
        <h1 class="text-lg font-semibold tracking-wide">{:lang('system_notice')}</h1>
        <p class="text-xs text-rose-100 mt-0.5">{:lang('error_notice')}</p>
    </div>

    <div class="p-8 space-y-6 text-center">

        <!-- Error Icon & Status -->
        <div class="flex flex-col items-center space-y-4 pt-2">
            <div class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center border border-rose-100 shadow-inner">
                <!-- Error / Warning Icon -->
                <svg class="w-10 h-10 text-rose-600 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <div class="space-y-1">
                <h2 id="error-title" class="text-xl font-bold text-slate-800">{$msg}</h2>
            </div>
        </div>

    </div>
</div>

</body>
</html>
